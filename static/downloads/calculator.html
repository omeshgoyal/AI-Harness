<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1e26;
    --key: #262c38;
    --key-hover: #323a49;
    --op: #2d3a55;
    --eq: #3b82f6;
    --eq-hover: #2f6fd6;
    --accent: #e6edf7;
    --muted: #8b93a3;
    --danger: #b4534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 30% 0%, #1b2233, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--accent);
  }
  .calc {
    width: 340px;
    background: var(--panel);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .screen {
    background: #0c0e12;
    border-radius: 14px;
    padding: 16px 18px;
    text-align: right;
    margin-bottom: 16px;
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .history {
    font-size: 14px;
    color: var(--muted);
    min-height: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: ltr;
  }
  .display {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: ltr;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 18px 0;
    font-size: 19px;
    font-weight: 600;
    color: var(--accent);
    background: var(--key);
    cursor: pointer;
    transition: background .12s ease, transform .05s ease;
    user-select: none;
  }
  button:hover { background: var(--key-hover); }
  button:active { transform: scale(.96); }
  .fn { color: #ffcb6b; }
  .op { background: var(--op); color: #9ec1ff; }
  .op:hover { background: #37476a; }
  .eq {
    background: var(--eq);
    grid-column: span 2;
    color: #fff;
  }
  .eq:hover { background: var(--eq-hover); }
  .zero { grid-column: span 2; }
  .clr { color: #ff9b93; }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="calc">
    <div class="screen">
      <div class="history" id="history"></div>
      <div class="display" id="display">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="fn clr" data-action="clear">AC</button>
      <button class="fn" data-action="backspace">⌫</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="fn" data-action="sign">±</button>
      <button class="zero" data-num="0">0</button>
      <button data-action="dot">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
    <div class="hint">Keyboard supported · Enter = · Esc clears</div>
  </div>

<script>
(function () {
  "use strict";

  var display = document.getElementById("display");
  var historyEl = document.getElementById("history");

  // state
  var current = "0";     // the number being typed
  var stored = null;     // { value: number, op: string }
  var lastResult = null; // for repeated "="

  function formatNumber(n) {
    if (!isFinite(n)) return "Error";
    // avoid floating point noise, keep up to 12 significant digits
    var s = parseFloat(n.toPrecision(12)).toString();
    if (s.indexOf("e") >= 0) return s;
    return s;
  }

  function render() {
    display.textContent = current;
    historyEl.textContent = stored ? formatNumber(stored.value) + " " + prettyOp(stored.op) : "";
  }

  function prettyOp(op) {
    return { "+": "+", "-": "−", "*": "×", "/": "÷" }[op] || op;
  }

  function inputDigit(d) {
    if (current === "0") {
      current = d;
    } else if (current === "-0") {
      current = "-" + d;
    } else {
      current += d;
    }
    render();
  }

  function inputDot() {
    if (current.indexOf(".") === -1) current += ".";
    render();
  }

  function toggleSign() {
    if (current.charAt(0) === "-") current = current.slice(1);
    else if (current !== "0") current = "-" + current;
    render();
  }

  function percent() {
    var v = parseFloat(current);
    if (isNaN(v)) return;
    // if we're in the middle of "a + b%", treat b% as a fraction of a
    if (stored && (stored.op === "+" || stored.op === "-")) {
      v = stored.value * v / 100;
    } else {
      v = v / 100;
    }
    current = formatNumber(v);
    render();
  }

  function clearAll() {
    current = "0";
    stored = null;
    lastResult = null;
    render();
  }

  function backspace() {
    if (current.length > 1) {
      current = current.slice(0, -1);
      if (current === "-" || current === "") current = "0";
    } else {
      current = "0";
    }
    render();
  }

  function compute(a, b, op) {
    switch (op) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/": return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function applyOperator(op) {
    var value = parseFloat(current);
    if (isNaN(value)) return;
    if (stored !== null) {
      var result = compute(stored.value, value, stored.op);
      if (isNaN(result) || !isFinite(result)) {
        current = "Error";
        stored = null;
        render();
        return;
      }
      stored = { value: result, op: op };
      current = formatNumber(result);
    } else {
      stored = { value: value, op: op };
      current = "0";
    }
    lastResult = null;
    render();
  }

  function equals() {
    var value = parseFloat(current);
    if (stored !== null) {
      var result = compute(stored.value, value, stored.op);
      if (isNaN(result) || !isFinite(result)) {
        current = "Error";
        stored = null;
        render();
        return;
      }
      historyEl.textContent = formatNumber(stored.value) + " " + prettyOp(stored.op) + " " + formatNumber(value) + " =";
      current = formatNumber(result);
      lastResult = { value: value, op: stored.op };
      stored = null;
      display.textContent = current;
      return;
    }
    // repeat last operation: 5 + 3 = => 8, = => 11
    if (lastResult) {
      var r = compute(parseFloat(current), lastResult.value, lastResult.op);
      current = formatNumber(r);
      render();
    }
  }

  // ---- event wiring ----
  document.getElementById("keys").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    handle(btn);
  });

  function handle(btn) {
    if (btn.dataset.num !== undefined) return inputDigit(btn.dataset.num);
    if (btn.dataset.op !== undefined) return applyOperator(btn.dataset.op);
    switch (btn.dataset.action) {
      case "clear": return clearAll();
      case "backspace": return backspace();
      case "percent": return percent();
      case "sign": return toggleSign();
      case "dot": return inputDot();
      case "equals": return equals();
    }
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k >= "0" && k <= "9") { inputDigit(k); e.preventDefault(); }
    else if (k === ".") { inputDot(); e.preventDefault(); }
    else if (k === "+" || k === "-" || k === "*" || k === "/") { applyOperator(k); e.preventDefault(); }
    else if (k === "Enter" || k === "=") { equals(); e.preventDefault(); }
    else if (k === "Backspace") { backspace(); e.preventDefault(); }
    else if (k === "Escape") { clearAll(); e.preventDefault(); }
    else if (k === "%") { percent(); e.preventDefault(); }
  });

  render();
})();
</script>
</body>
</html>
