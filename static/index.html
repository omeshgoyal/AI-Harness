<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Harness UI</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="newSession()">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Chat
        </button>
        <h2>Recent Chats</h2>
        <div class="session-list" id="session-list"></div>
        <div style="margin-top: auto; padding-top: 1rem; font-size: 12px; color: #888;">
            Cost: $<span id="cost">0.00</span>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <button class="icon-btn" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
        </div>
        
        <div class="chat-container" id="scroll-container">
            <div class="chat-history" id="chat"></div>
        </div>
        
        <div class="input-area">
            <div class="input-container">
                <textarea id="prompt" rows="1" placeholder="Message AI Harness..."></textarea>
                <button id="send" class="send-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
